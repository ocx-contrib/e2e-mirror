name: cascade-signing

# A cascade breaks when a push lands out of order or dies half-way. Dispatch is
# always available, and defaults to auditing. An operator who wants the repair
# unattended opts in with `cascade: { schedule: … }` in the spec — a scheduled
# run repairs for real, never as a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the repair plan without writing a tag or touching the index
        type: boolean
        default: true

concurrency:
  # This spec's publish group, baked in: a repair and a live push both re-point
  # the same rolling aliases, so neither ever runs while the other is in flight.
  # GitHub keeps one *pending* run per group, so whichever of the two is waiting
  # is cancelled when a newer run of either workflow queues behind the live one.
  group: mirror-e2e-signing-publish
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b  # v1.3.0
        with:
          version: "0.6.0"
      # Detect whether registry credentials are configured.
      # GitHub does not allow `secrets.*` in job-level `if:`, so we probe at
      # step level via env-var injection (secret value never echoed to logs).
      - name: Detect registry credentials
        id: creds
        env:
          OCX_MIRROR_REGISTRY_TOKEN: ${{ secrets.OCX_MIRROR_REGISTRY_TOKEN }}
        run: |
          if [ -n "${OCX_MIRROR_REGISTRY_TOKEN}" ]; then
            echo "have=true" >> "${GITHUB_OUTPUT}"
          else
            echo "have=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No OCX_MIRROR_REGISTRY_TOKEN secret — registry push skipped (repo runs in test/validation mode)."
          fi
      # Use docker login so ocx picks credentials up via its
      # native-credential fallback (`get_docker_auth` in crates/ocx_lib/src/auth.rs).
      # Env-var auth (`OCX_AUTH_<REG>_USER/_TOKEN`) takes precedence over the
      # docker fallback inside ocx, so do NOT also export those vars here.
      - name: Login to dev.ocx.sh
        if: ${{ steps.creds.outputs.have == 'true' }}
        run: |
          echo "${{ secrets.OCX_MIRROR_REGISTRY_TOKEN }}" \
            | docker login dev.ocx.sh \
                -u "${{ secrets.OCX_MIRROR_REGISTRY_USER }}" \
                --password-stdin
      - name: Repair the rolling-tag cascade
        if: ${{ steps.creds.outputs.have == 'true' }}
        env:
          # A repaired alias points at a digest the index does not know, so a
          # run that moved anything ends by announcing. Absent, that announce
          # is recorded as skipped rather than failing a run whose tags already
          # landed — the same degradation the push job has.
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          # Read through the environment, never interpolated into the script.
          # `inputs.dry_run` is empty on a schedule event, which would read as
          # "not true" by accident — spell the scheduled answer out instead.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ocx-mirror package pipeline cascade --spec signing/mirror.yml --dry-run
          else
            ocx-mirror package pipeline cascade --spec signing/mirror.yml
          fi
